[project]
name = "jembatan-modal"
version = "0.1.0"
description = "Backend + UI chat JembatanModal: asisten AI yang mengubah catatan keuangan UMKM jadi kejelasan untung-rugi jujur & kesiapan modal formal."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Lapisan API/LLM digarap di slice berikutnya; sengaja dipisah agar core
# (skema + service HPP + test) bisa diinstal & diuji tanpa dependensi berat.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
]
pdf = [
    "weasyprint>=61",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
